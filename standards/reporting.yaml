version: 1
name: 报表规范
description: 看板与图表的统一规范。AI 生成看板前必须加载本规范；产出必须通过 lint 才能提交审批。

## ------------------------------------------------------------------
## 视觉规范（固定，不允许每次都换）
## ------------------------------------------------------------------
theme:
  palette:
    - "#2563eb"   # 主色
    - "#0891b2"
    - "#16a34a"
    - "#d97706"
    - "#db2777"
    - "#7c3aed"
    - "#dc2626"
    - "#0d9488"
  max_series: 5
  font:
    family: "PingFang SC, Microsoft YaHei, sans-serif"
    title: 16
    body: 13
    caption: 12
  spacing:
    card_padding: 16
    card_gap: 12
  grid:
    cols: 12
    row_height: 72

## ------------------------------------------------------------------
## 图表选择矩阵（什么场景用什么图）
## ------------------------------------------------------------------
chart_selection:
  - condition: 单指标 + 时间维度
    chart: line
    reason: 时间趋势必须用折线，不用柱状
  - condition: 单指标 + 时间维度 + 类别维度（≤5 类）
    chart: line
    reason: 多系列折线，系列数受调色板上限约束
  - condition: 单指标 + 类别维度（≤8 类）
    chart: bar
    reason: 类别对比用柱状
  - condition: 单指标 + 类别维度（>8 类）
    chart: bar_h
    reason: 类别过多改横向条形，避免标签重叠
  - condition: 两个指标 + 时间维度
    chart: line
    reason: 双轴折线，必须标注左右轴含义
  - condition: 占比 / 构成
    chart: pie
    limit: 6
    reason: 饼图最多 6 类，超过改用条形图
  - condition: 单值（无维度）
    chart: kpi
    reason: 核心数字用指标卡，带同比环比
  - condition: 明细数据（无聚合）
    chart: table
    reason: 明细用表格，不做图形化

## ------------------------------------------------------------------
## 布局规范
## ------------------------------------------------------------------
layout_rules:
  - 顶部放 3~4 个核心指标卡
  - 筛选器统一在顶部，不散落
  - 单卡宽度为 12 栅格的约数（3/4/6/8/12）
  - 看板卡片数不超过 12 张
  - 同类图表横向对齐，高度一致
  - 一屏内不超过 6 个视觉焦点

## ------------------------------------------------------------------
## 命名规范
## ------------------------------------------------------------------
naming:
  dashboard_rule: '{业务域}{周期}{主题}分析'
  dashboard_examples:
    good: [交易域2026年9月经营分析, 用户域新客留存分析]
    bad: [看板1, 测试看板, dashboard_new]
  card_rule: '{指标} · {维度}（{时间范围}）'
  card_examples:
    good: [GMV · 渠道（近30天）, 订单量趋势（9月）]
    bad: [图表1, 123, 无标题]

## ------------------------------------------------------------------
## 禁忌（生成时直接排除）
## ------------------------------------------------------------------
forbidden:
  - 3D 图表
  - 超过 6 个类的饼图
  - 超过 5 个系列色
  - 未标注的双 Y 轴
  - 柱状图截断 Y 轴（必须从 0 开始）
  - 折线图用于无序类别
  - 卡片标题为空或使用默认名

## ------------------------------------------------------------------
## 规则执行级别
## ------------------------------------------------------------------
enforcement:
  title_required: error
  chart_type: error
  layout_bounds: error
  layout_overlap: warn
  max_cards: warn
  card_title: warn
  naming: warn

allowed_chart_kinds: [line, bar, bar_h, pie, kpi, table, map, scatter]
max_cards: 12
